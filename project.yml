name: JigTail
options:
  bundleIdPrefix: dev.campina
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
targets:
  JigTail:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: JigTail
        excludes:
          - "Resources/Info.plist"
          - "Resources/JigTail.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.campina.jigtail
        INFOPLIST_FILE: JigTail/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: JigTail/Resources/JigTail.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JigTailTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: JigTailTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
    dependencies:
      - target: JigTail
schemes:
  JigTail:
    build:
      targets:
        JigTail: all
        JigTailTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JigTailTests
